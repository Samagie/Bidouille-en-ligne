name: Publier la vitrine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Mettre à jour la liste des expériences
        run: python3 outils/labo.py index

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
