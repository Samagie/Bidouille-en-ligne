<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mind the Gap">
  <meta name="theme-color" content="#eef1f6">
  <title>Mind the Gap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='42' y='0' width='16' height='100' fill='%23d42a20'/><circle cx='50' cy='50' r='24' fill='white' stroke='%2313203a' stroke-width='10'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    /* Idée : la séance du jour est une ligne de métro. Chaque bloc est une station de couleur,
       et les exercices à trous reprennent le « gap » du nom. */
    :root {
      --fond: #eef1f6;
      --surface: #ffffff;
      --encre: #13203a;
      --doux: #566179;
      --trait: #d3d9e3;
      --ombre: rgba(19, 32, 58, 0.45);
      --l-vocab: #d42a20;
      --l-gram: #0b5fc4;
      --l-conj: #0b8743;
      --l-bases: #e09b00;
      --l-diction: #8a3aa0;
      --bon: #0b7a3d;
      --faux: #c62828;
      --sur-accent: #ffffff;
      --sur-bases: #231a00;
      --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
      --corps: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fond: #0e1422;
        --surface: #172033;
        --encre: #e7ebf3;
        --doux: #9da8bd;
        --trait: #2b3753;
        --ombre: rgba(0, 0, 0, 0.6);
        --l-vocab: #ff6a5e;
        --l-gram: #5aa0ff;
        --l-conj: #35c47a;
        --l-bases: #ffc23d;
        --l-diction: #c788e3;
        --bon: #44d08a;
        --faux: #ff7b7b;
        --sur-accent: #0e1422;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --fond: #0e1422;
      --surface: #172033;
      --encre: #e7ebf3;
      --doux: #9da8bd;
      --trait: #2b3753;
      --ombre: rgba(0, 0, 0, 0.6);
      --l-vocab: #ff6a5e;
      --l-gram: #5aa0ff;
      --l-conj: #35c47a;
      --l-bases: #ffc23d;
      --l-diction: #c788e3;
      --bon: #44d08a;
      --faux: #ff7b7b;
      --sur-accent: #0e1422;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html {
      background: var(--fond);
      color: var(--encre);
      font-family: var(--corps);
      font-size: 17px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    body { margin: 0; background: var(--fond); }
    a { color: var(--l-gram); }
    :focus-visible { outline: 3px solid var(--l-gram); outline-offset: 3px; border-radius: 6px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .retour { display: inline-block; margin: 0.75rem 1rem 0; font-size: 0.9rem; }
    #app { width: min(100% - 2rem, 70rem); margin: 0 auto; padding: 0.5rem 0 4rem; }

    h1, h2 { font-family: var(--display); text-wrap: balance; line-height: 1.08; letter-spacing: -0.02em; }

    /* ---------- Boutons ---------- */
    .bouton {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      font: inherit; font-weight: 700;
      min-height: 52px; padding: 0.7rem 1.2rem;
      border-radius: 14px; border: 2px solid var(--trait);
      background: var(--surface); color: var(--encre);
      cursor: pointer; touch-action: manipulation;
      transition: border-color 0.15s, transform 0.1s;
    }
    .bouton:hover { border-color: var(--encre); }
    .bouton:active { transform: scale(0.98); }
    .bouton.principal { background: var(--accent, var(--encre)); color: var(--sur, var(--fond)); border-color: transparent; }
    .bouton.discret { min-height: 44px; padding: 0.4rem 0.9rem; font-size: 0.9rem; }
    .bouton svg { flex: none; }
    .rond {
      display: inline-grid; place-items: center; flex: none;
      width: 42px; height: 42px; padding: 0;
      border-radius: 50%; border: 2px solid var(--trait);
      background: var(--surface); color: var(--encre); cursor: pointer;
    }
    .rond:hover { border-color: var(--accent, var(--encre)); }

    /* ---------- Accueil ---------- */
    .tete {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: 0.75rem 0 1.25rem; border-bottom: 3px solid var(--encre);
    }
    .logo { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1; letter-spacing: -0.03em; }
    .trou-logo { display: inline-block; padding: 0 0.12em; color: var(--l-vocab); border-bottom: 0.13em solid var(--l-vocab); }
    .devise { margin: 0.4rem 0 0; color: var(--doux); }
    .puce-serie { margin: 0; padding: 0.35rem 0.9rem; border: 2px solid var(--encre); border-radius: 999px; font-weight: 700; font-size: 0.9rem; }
    .puce-serie b { font-family: var(--display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }

    .accueil { display: grid; gap: 2.75rem; padding-top: 1.75rem; }
    @media (min-width: 860px) { .accueil { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 4rem; } }

    .surtitre { margin: 0; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--doux); }
    h1 { font-size: clamp(2.3rem, 8vw, 3.5rem); font-weight: 800; margin: 0.35rem 0 0.5rem; }
    .chapo { margin: 0 0 1.25rem; color: var(--doux); max-width: 34rem; }

    .ligne { list-style: none; margin: 1.75rem 0 0; padding: 0; }
    .station { display: grid; grid-template-columns: 52px minmax(0, 1fr); }
    .rail { position: relative; }
    .rail::before {
      content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 12px; margin-left: -6px; background: var(--c); opacity: 0.3;
    }
    .station.faite .rail::before { opacity: 1; }
    .station:first-child .rail::before { top: 33px; }
    .station:last-child .rail::before { bottom: auto; height: 33px; }
    .pastille {
      position: absolute; z-index: 1; left: 50%; top: 33px;
      width: 30px; height: 30px; margin: -15px 0 0 -15px;
      display: grid; place-items: center;
      border-radius: 50%; border: 6px solid var(--c); background: var(--surface);
    }
    .station.faite .pastille { background: var(--c); }
    .station.faite .pastille::after {
      content: ""; width: 9px; height: 5px; margin-top: -2px;
      border-left: 3px solid var(--surface); border-bottom: 3px solid var(--surface);
      transform: rotate(-45deg);
    }
    .station.prochaine .pastille {
      width: 38px; height: 38px; margin: -19px 0 0 -19px; border-width: 8px;
      animation: pouls 2.2s ease-out infinite;
    }
    @keyframes pouls {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); }
      70% { box-shadow: 0 0 0 16px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .st {
      all: unset; box-sizing: border-box; cursor: pointer;
      display: grid; gap: 0.1rem; width: 100%;
      padding: 0.85rem 0.9rem 1.35rem 0.6rem; border-radius: 12px;
    }
    .st:hover { background: color-mix(in srgb, var(--c) 9%, transparent); }
    .st:focus-visible { outline: 3px solid var(--c); outline-offset: 0; }
    .st-haut { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    .st-nom { font-family: var(--display); font-weight: 800; font-size: 1.4rem; line-height: 1.4; }
    .st-min { font-size: 0.85rem; color: var(--doux); font-variant-numeric: tabular-nums; }
    .st-sujet { font-size: 1rem; }
    .st-etat { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--doux); }
    .station.prochaine .st-etat { color: var(--encre); }

    .col-cote { display: grid; gap: 2.25rem; align-content: start; }
    .col-cote h2 { font-size: 1.3rem; margin: 0 0 0.75rem; padding-bottom: 0.45rem; border-bottom: 3px solid var(--encre); }
    .jours { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
    .jour {
      all: unset; box-sizing: border-box; cursor: pointer;
      display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; align-items: center; gap: 0.75rem;
      width: 100%; padding: 0.55rem 0.75rem; border-radius: 12px; border: 2px solid transparent;
    }
    .jour:hover { background: var(--surface); }
    .jour:focus-visible { outline: 3px solid var(--l-gram); }
    .jour.choisi { background: var(--surface); border-color: var(--encre); }
    .j-num { font-family: var(--display); font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .j-etat { font-size: 0.8rem; font-weight: 700; color: var(--doux); font-variant-numeric: tabular-nums; }
    .j-etat.fini { color: var(--bon); }
    .note { margin: 0.75rem 0 0; font-size: 0.88rem; color: var(--doux); }

    .chiffres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem 1.5rem; margin: 0; }
    .chiffres > div { border-left: 4px solid var(--trait); padding-left: 0.75rem; }
    .chiffres dt { font-size: 0.85rem; color: var(--doux); }
    .chiffres dd { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .aide p { margin: 0 0 0.6rem; color: var(--doux); max-width: 38rem; }
    .aide b { color: var(--encre); }

    /* ---------- Séance ---------- */
    .barre {
      position: sticky; top: 0; z-index: 5;
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.9rem;
      padding: 0.75rem 0; background: var(--fond);
    }
    .mini-ligne { display: flex; gap: 4px; }
    .seg { flex: 1; height: 10px; border-radius: 5px; overflow: hidden; background: color-mix(in srgb, var(--c) 22%, var(--fond)); }
    .rempli { display: block; width: 0; height: 100%; background: var(--c); transition: width 0.4s ease; }
    .chrono { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chrono .sur { color: var(--doux); font-weight: 400; }

    .scene { width: min(100%, 44rem); margin: 0.75rem auto 0; }
    .etiquette { margin: 0 0 0.75rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--doux); }
    .etiquette b { color: var(--accent); }
    .carte {
      background: var(--surface); border-radius: 20px; border-top: 8px solid var(--accent);
      padding: clamp(1.25rem, 5vw, 2.5rem);
      box-shadow: 0 22px 44px -32px var(--ombre);
    }
    .carte h2 { font-size: clamp(1.6rem, 5.5vw, 2.2rem); margin: 0 0 1rem; }
    .consigne { margin: 0 0 0.5rem; font-weight: 700; color: var(--doux); }
    .texte { max-width: 38rem; }
    .texte p { margin: 0 0 0.75rem; }
    .texte ul { margin: 0 0 0.75rem; padding-left: 1.2rem; }
    .texte li { margin: 0.35rem 0; }
    .piege {
      padding: 0.7rem 0.9rem; border-left: 5px solid var(--l-bases); border-radius: 0 10px 10px 0;
      background: color-mix(in srgb, var(--l-bases) 15%, var(--surface));
    }

    .exemples { list-style: none; margin: 1.25rem 0 0; padding: 0; display: grid; gap: 0.7rem; }
    .exemples li { display: flex; align-items: center; gap: 0.8rem; }
    .ex-en { display: block; font-weight: 700; font-size: 1.1rem; }
    .ex-fr { display: block; color: var(--doux); font-size: 0.95rem; }

    .mot-zone { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; margin: 0.25rem 0 1.25rem; }
    .mot { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(2.5rem, 11vw, 4.2rem); line-height: 1; letter-spacing: -0.03em; }
    .verso { padding-top: 1rem; border-top: 2px dashed var(--trait); }
    .traduction { margin: 0 0 0.75rem; font-size: 1.5rem; font-weight: 700; }
    .exemple { display: flex; align-items: center; gap: 0.75rem; margin: 0; font-size: 1.15rem; }
    .exemple-fr { margin: 0.25rem 0 0; color: var(--doux); }

    .enonce { margin: 0.25rem 0 1.5rem; font-size: clamp(1.35rem, 5vw, 1.85rem); line-height: 1.55; }
    .trou {
      display: inline-block; min-width: 4.2em; padding: 0 0.3em;
      border-bottom: 4px solid var(--accent); text-align: center; font-weight: 700; line-height: 1.25;
    }
    .trou.bon { color: var(--bon); border-color: var(--bon); }
    .options { display: grid; gap: 0.6rem; }
    @media (min-width: 600px) { .options { grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); } }
    .option {
      font: inherit; font-size: 1.1rem; font-weight: 700; text-align: left;
      min-height: 58px; padding: 0.8rem 1rem; border-radius: 14px;
      border: 2px solid var(--trait); background: var(--surface); color: var(--encre); cursor: pointer;
      touch-action: manipulation;
    }
    .option:hover:not(:disabled) { border-color: var(--accent); }
    .option:disabled { cursor: default; }
    .option:disabled:not(.bon):not(.faux) { opacity: 0.5; }
    .option.bon { border-color: var(--bon); background: color-mix(in srgb, var(--bon) 14%, var(--surface)); }
    .option.faux { border-color: var(--faux); background: color-mix(in srgb, var(--faux) 12%, var(--surface)); text-decoration: line-through; }

    .retour-rep { display: grid; gap: 0.6rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 2px dashed var(--trait); }
    .verdict { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.45rem; }
    .verdict.bon { color: var(--bon); }
    .verdict.faux { color: var(--faux); }
    .expl { margin: 0; }
    .ecoute-ligne { display: flex; align-items: center; gap: 0.75rem; margin: 0; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-top: 1.5rem; }
    .actions .bouton { flex: 1 1 12rem; }

    .table-defile { overflow-x: auto; margin: 0 -0.25rem; }
    .verbes { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
    .verbes th { padding: 0.4rem 0.5rem; text-align: left; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--doux); border-bottom: 3px solid var(--encre); }
    .verbes td { padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--trait); vertical-align: middle; }
    .verbes .base { font-family: var(--display); font-weight: 800; font-size: 1.25rem; }
    .verbes .sens { display: block; font-family: var(--corps); font-weight: 400; font-size: 0.85rem; color: var(--doux); }
    .astuce { margin: 1rem 0 0; color: var(--doux); }

    .saisie { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .saisie input {
      flex: 1 1 12rem; min-height: 56px; padding: 0.6rem 0.9rem;
      font: inherit; font-size: 1.3rem; color: var(--encre);
      background: var(--fond); border: 2px solid var(--trait); border-radius: 14px;
    }
    .saisie input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
    .lien { all: unset; cursor: pointer; display: inline-block; margin-top: 0.9rem; font-size: 0.95rem; color: var(--doux); text-decoration: underline; }
    .lien:focus-visible { outline: 3px solid var(--accent); }

    .phrase-dite { margin: 0.25rem 0 0.35rem; font-size: clamp(1.55rem, 6vw, 2.2rem); font-weight: 700; line-height: 1.35; }
    .phrase-dite .m { transition: color 0.2s; }
    .phrase-dite .m.ok { color: var(--bon); }
    .phrase-dite .m.rate { color: var(--faux); text-decoration: underline wavy; text-underline-offset: 5px; text-decoration-thickness: 2px; }
    .trad { margin: 0 0 1.25rem; color: var(--doux); }
    .ecoutes { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .micro-zone { display: grid; justify-items: start; gap: 0.5rem; margin-top: 1.25rem; }
    .bouton.micro { min-height: 60px; padding-inline: 1.5rem; font-size: 1.1rem; background: var(--accent); color: var(--sur); border-color: transparent; }
    .bouton.micro.actif { animation: pouls-micro 1.2s ease-out infinite; }
    @keyframes pouls-micro {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
      100% { box-shadow: 0 0 0 18px transparent; }
    }
    .micro-info { margin: 0; color: var(--doux); }
    .question-auto { flex-basis: 100%; margin: 0; font-weight: 700; }

    .bilan-chiffres { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 1.25rem 0 1.5rem; }
    .bilan-chiffres > div { border-left-color: var(--accent); }
    .recap { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
    .recap li { display: flex; align-items: center; gap: 0.6rem; }
    .recap .point { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
    .recap .vide { background: transparent; border: 3px solid var(--c); }
    .recap span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
    .bravo { animation: entree 0.5s cubic-bezier(.2, .9, .3, 1.2) both; }
    @keyframes entree { from { transform: translateY(14px) scale(0.97); opacity: 0.4; } to { transform: none; opacity: 1; } }

    .toast {
      position: fixed; z-index: 20; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
      max-width: calc(100% - 2rem); padding: 0.75rem 1.1rem; border-radius: 12px;
      background: var(--encre); color: var(--fond); font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="retour" href="../../">← Retour au labo</a>
  <div id="app"></div>

  <script>
  (() => {
    'use strict';

    /* =========================================================
       Le programme : 5 stations par jour, 5 jours pour commencer
       ========================================================= */

    const BLOCS = [
      { id: 'vocab',   nom: 'Vocabulaire', min: 6, c: '--l-vocab',   sur: '--sur-accent' },
      { id: 'gram',    nom: 'Grammaire',   min: 6, c: '--l-gram',    sur: '--sur-accent' },
      { id: 'conj',    nom: 'Conjugaison', min: 4, c: '--l-conj',    sur: '--sur-accent' },
      { id: 'bases',   nom: 'Les bases',   min: 3, c: '--l-bases',   sur: '--sur-bases' },
      { id: 'diction', nom: 'Diction',     min: 6, c: '--l-diction', sur: '--sur-accent' },
    ];
    const OBJECTIF_MIN = BLOCS.reduce((s, b) => s + b.min, 0);

    const JOURS = [
      {
        n: 1, theme: 'Se présenter',
        vocab: [
          ['job', 'métier, travail', "What's your job? I'm a nurse.", 'Quel est ton métier ? Je suis infirmière.'],
          ['to live', 'habiter, vivre', 'I live in a small flat in Lyon.', 'J’habite dans un petit appartement à Lyon.'],
          ['neighbour', 'voisin, voisine', 'My neighbour has a very noisy dog.', 'Mon voisin a un chien très bruyant.'],
          ['siblings', 'frères et sœurs', 'I have two siblings: a brother and a sister.', 'J’ai un frère et une sœur.'],
          ['married', 'marié, mariée', 'They have been married for ten years.', 'Ils sont mariés depuis dix ans.'],
          ['hometown', 'ville natale', 'My hometown is near the sea.', 'Ma ville natale est près de la mer.'],
          ['to grow up', 'grandir', 'I grew up in the countryside.', 'J’ai grandi à la campagne.'],
          ['hobby', 'loisir, passe-temps', 'My favourite hobby is cooking.', 'Mon passe-temps préféré, c’est la cuisine.'],
        ],
        gram: {
          titre: 'Le verbe be : am, is, are',
          regle: `<p><b>Be</b> veut dire <i>être</i>. Il change selon le sujet :</p>
            <ul><li><b>I am</b></li><li><b>you are</b>, <b>we are</b>, <b>they are</b></li><li><b>he is</b>, <b>she is</b>, <b>it is</b></li></ul>
            <p>À l’oral, on contracte presque toujours : <b>I’m, you’re, he’s, we’re</b>. Négation : <b>I’m not, he isn’t, they aren’t</b>. Question : on inverse, <b>Are you French?</b></p>
            <p class="piege">Piège : l’âge se dit avec <b>be</b>, pas avec <i>have</i>. <b>I am 30</b> = j’ai 30 ans.</p>`,
          exemples: [["I'm from Lyon.", 'Je viens de Lyon.'], ["She isn't at home.", 'Elle n’est pas à la maison.'], ['Are they your friends?', 'Ce sont tes amis ?']],

    const CLE = 'mind-the-gap:v1';
    function lire() {
      try { return JSON.parse(localStorage.getItem(CLE) || 'null') || {}; } catch (e) { return {}; }
    }
    const etat = Object.assign({ jours: {}, mots: {}, serie: { n: 0, dernier: null }, secondes: 0, seances: 0 }, lire());
    function sauver() {
      try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* mémoire indisponible : tant pis */ }
    }
    function etatJour(n) {
      if (!etat.jours[n]) etat.jours[n] = { blocs: {}, secondes: 0 };
      return etat.jours[n];
    }
    function dateCle(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function hierCle() { const d = new Date(); d.setDate(d.getDate() - 1); return dateCle(d); }
    function serieActuelle() {
      const s = etat.serie;
      if (!s.dernier) return 0;
      return (s.dernier === dateCle(new Date()) || s.dernier === hierCle()) ? s.n : 0;
    }
    function majSerie() {
      const auj = dateCle(new Date());
      if (etat.serie.dernier === auj) return;
      etat.serie.n = etat.serie.dernier === hierCle() ? etat.serie.n + 1 : 1;
      etat.serie.dernier = auj;
    }

    /* =========================================================
       Petits outils
       ========================================================= */

    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function melanger(t) {
      const a = t.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function avecTrou(texte, rempli) {
      return esc(texte).replace('___', `<span class="trou${rempli ? ' bon' : ''}">${rempli ? esc(rempli) : '&nbsp;'}</span>`);
    }
    function mmss(s) {
      s = Math.max(0, Math.floor(s));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }
    const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;
    let toastId = null;
    function toast(msg) {
      let t = $('.toast');
      if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
      t.textContent = msg; t.hidden = false;
      clearTimeout(toastId); toastId = setTimeout(() => { t.hidden = true; }, 3500);
    }

    const ICONE_SON = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const ICONE_MICRO = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

    /* =========================================================
       La voix : écouter (synthèse) et répéter (reconnaissance)
       ========================================================= */

    const synth = window.speechSynthesis || null;
    let voix = null;
    function choisirVoix() {
      if (!synth) return;
      const v = synth.getVoices();
      voix = v.find(x => /en[-_]GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null;
    }
    if (synth) {
      choisirVoix();
      if (synth.addEventListener) synth.addEventListener('voiceschanged', choisirVoix);
    }
    function dire(texte, lent) {
      if (!synth || !window.SpeechSynthesisUtterance) { toast('La voix n’est pas disponible sur ce navigateur.'); return; }
      try {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(texte.replace(/\s*\(.*?\)/g, '').replace(/ \/ /g, ', '));
        u.lang = voix ? voix.lang : 'en-GB';
        if (voix) u.voice = voix;
        u.rate = lent ? 0.6 : 0.92;
        synth.speak(u);
      } catch (e) { toast('La voix n’a pas pu démarrer.'); }
    }

    const Reco = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const CONTRACTIONS = {
      "i'm": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are', "it's": 'it is', "that's": 'that is',
      "he's": 'he is', "she's": 'she is', "what's": 'what is', "there's": 'there is', "i'd": 'i would', "i've": 'i have',
      "don't": 'do not', "doesn't": 'does not', "didn't": 'did not', "can't": 'can not', 'cannot': 'can not',
      "isn't": 'is not', "aren't": 'are not', "won't": 'will not', "let's": 'let us', "i'll": 'i will',
    };
    function normaliser(mot) {
      const m = mot.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9']/g, '');
      if (!m) return [];
      return (CONTRACTIONS[m] || m.replace(/'/g, '')).split(' ').filter(Boolean);
    }
    // Compare la phrase attendue et ce qui a été entendu, mot à mot (plus longue sous-suite commune).
    function comparer(cible, entendu) {
      const affiches = cible.split(/\s+/);
      const plat = [];
      affiches.forEach((w, i) => normaliser(w).forEach(t => plat.push({ t, i })));
      const dits = entendu.split(/\s+/).flatMap(normaliser);
      const n = plat.length, m = dits.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let a = n - 1; a >= 0; a--) for (let b = m - 1; b >= 0; b--) {
        dp[a][b] = plat[a].t === dits[b] ? dp[a + 1][b + 1] + 1 : Math.max(dp[a + 1][b], dp[a][b + 1]);
      }
      const ok = new Array(n).fill(false);
      let a = 0, b = 0;
      while (a < n && b < m) {
        if (plat[a].t === dits[b]) { ok[a] = true; a++; b++; }
        else if (dp[a + 1][b] >= dp[a][b + 1]) a++;
        else b++;
      }
      const mots = affiches.map((w, i) => ({ w, ok: plat.every((p, k) => p.i !== i || ok[k]) }));
      return { mots, score: n ? ok.filter(Boolean).length / n : 0, texte: entendu };
    }

    /* =========================================================
       Les étapes de chaque station
       ========================================================= */

    function qcmMot(mot, liste, revision) {
      const autres = melanger(liste.filter(x => x !== mot)).slice(0, 2).map(x => x[0]);
      return {
        type: 'qcm',
        consigne: revision ? 'Révision d’un mot à revoir : comment dit-on en anglais ?' : 'Comment dit-on en anglais ?',
        texte: `« ${mot[1]} »`,
        options: melanger([mot[0], ...autres]),
        bonne: mot[0], expl: `Exemple : ${mot[2]}`, ecoute: mot[0], mot: mot[0],
      };
    }

    function etapesDuBloc(n, id) {
      const J = JOURS[n - 1];
      if (id === 'vocab') {
        const cartes = J.vocab.map(m => ({ type: 'carte', mot: m }));
        const quiz = melanger(J.vocab).slice(0, 4).map(m => qcmMot(m, J.vocab, false));
        // Jusqu'à 2 mots des jours précédents marqués « à revoir ».
        const anciens = JOURS.filter(j => j.n < n)
          .flatMap(j => j.vocab.map(m => ({ m, liste: j.vocab })))
          .filter(x => etat.mots[x.m[0]] === 1);
        const revisions = melanger(anciens).slice(0, 2).map(x => qcmMot(x.m, x.liste, true));
        return [...cartes, ...melanger([...quiz, ...revisions])];
      }
      if (id === 'gram') {
        const g = J.gram;
        return [
          { type: 'lecon', consigne: 'La règle', titre: g.titre, html: g.regle, exemples: g.exemples },
          ...g.questions.map(q => ({
            type: 'qcm', consigne: 'Complète la phrase', texte: q[0], anglais: true,
            options: melanger(q[1]), bonne: q[1][q[2]], expl: q[3], ecoute: q[0].replace('___', q[1][q[2]]),
          })),
        ];
      }
      if (id === 'conj') {
        const c = J.conj;
        return [
          { type: 'tableau', titre: c.titre, verbes: c.verbes },
          ...melanger(c.questions).map(q => ({ type: 'saisie', texte: q[0], verbe: q[1], reps: q[2] })),
        ];
      }
      if (id === 'bases') {
        const b = J.bases;
        return [
          { type: 'lecon', consigne: 'À savoir', titre: b.titre, html: b.astuce },
          ...b.questions.map(q => {
            const trou = q[0].includes('___');
            return {
              type: 'qcm', consigne: 'Choisis la bonne réponse', texte: q[0], anglais: trou,
              options: q[1].slice(), bonne: q[1][q[2]], expl: q[3], ecoute: trou ? q[0].replace('___', q[1][q[2]]) : null,
            };
          }),
        ];
      }
      const d = J.diction;
      return [
        { type: 'lecon', consigne: 'Le son du jour', titre: d.titre, html: d.astuce },
        ...d.phrases.map(p => ({ type: 'parole', en: p[0], fr: p[1] })),
      ];
    }

    /* =========================================================
       Accueil
       ========================================================= */

    const app = $('#app');
    let jourSel = (JOURS.find(j => !etatJour(j.n).fini) || JOURS[JOURS.length - 1]).n;
    let seance = null;
    let chronoId = null;

    function renderAccueil() {
      arreterChrono();
      if (Reco && recoActive) { try { recoActive.abort(); } catch (e) { /* rien */ } }
      seance = null;
      const J = JOURS[jourSel - 1];
      const ej = etatJour(jourSel);
      const faits = BLOCS.filter(b => ej.blocs[b.id]);
      const prochain = BLOCS.find(b => !ej.blocs[b.id]);
      const libelle = faits.length === 0 ? 'Commencer la séance' : prochain ? `Reprendre : ${prochain.nom}` : 'Refaire la séance';
      const serie = serieActuelle();
      const minutesJour = Math.round(ej.secondes / 60);
      const motsVus = Object.keys(etat.mots).length;
      const motsRetenus = Object.values(etat.mots).filter(b => b >= 2).length;

      app.innerHTML = `
        <header class="tete">
          <div class="marque">
            <p class="logo">Mind the <span class="trou-logo">gap</span></p>
            <p class="devise">L’anglais, ${OBJECTIF_MIN} minutes par jour</p>
          </div>
          <p class="puce-serie" title="Jours d’affilée avec une séance complète"><b>${serie}</b> ${serie > 1 ? 'jours' : 'jour'} d’affilée</p>
        </header>
        <div class="accueil">
          <section class="col-ligne" aria-labelledby="titre-jour">
            <p class="surtitre">Jour ${J.n} sur ${JOURS.length} · ${esc(J.theme)}</p>
            <h1 id="titre-jour">La ligne du jour</h1>
            <p class="chapo">${BLOCS.length} stations, environ ${OBJECTIF_MIN} minutes.${minutesJour ? ` Déjà ${minutesJour} min sur ce jour.` : ' Touche une station pour y aller directement.'}</p>
            <button class="bouton principal" id="go">${libelle}</button>
            <ol class="ligne">
              ${BLOCS.map(b => {
                const r = ej.blocs[b.id];
                const cls = r ? 'faite' : b === prochain ? 'prochaine' : '';
                const etiquette = r ? `Faite · ${r.ok}/${r.total} bonnes réponses` : b === prochain ? 'Prochaine station' : 'À faire';
                return `<li class="station ${cls}" style="--c: var(${b.c})">
                  <span class="rail" aria-hidden="true"><span class="pastille"></span></span>
                  <button class="st" data-bloc="${b.id}" aria-label="${esc(`${b.nom}, ${b.min} minutes : ${sujetBloc(J, b.id)}. ${etiquette}`)}">
                    <span class="st-haut"><span class="st-nom">${b.nom}</span><span class="st-min">${b.min} min</span></span>
                    <span class="st-sujet">${esc(sujetBloc(J, b.id))}</span>
                    <span class="st-etat">${etiquette}</span>
                  </button>
                </li>`;
              }).join('')}
            </ol>
          </section>

          <aside class="col-cote">
            <section aria-labelledby="t-prog">
              <h2 id="t-prog">Le programme</h2>
              <ol class="jours">
                ${JOURS.map(j => {
                  const e = etatJour(j.n);

                  return `<li><button class="jour${j.n === jourSel ? ' choisi' : ''}" data-jour="${j.n}" aria-pressed="${j.n === jourSel}">
                    <span class="j-num">J${j.n}</span><span>${esc(j.theme)}</span><span class="j-etat${e.fini ? ' fini' : ''}">${txt}</span>

                }).join('')}
              </ol>

            </section>

            <section aria-labelledby="t-chiffres">
              <h2 id="t-chiffres">Tes chiffres</h2>
              <dl class="chiffres">
                <div><dt>Séances complètes</dt><dd>${etat.seances}</dd></div>
                <div><dt>Minutes au total</dt><dd>${Math.round(etat.secondes / 60)}</dd></div>
                <div><dt>Mots vus</dt><dd>${motsVus}</dd></div>
                <div><dt>Mots retenus</dt><dd>${motsRetenus}</dd></div>
              </dl>
            </section>

            <section class="aide" aria-labelledby="t-aide">
              <h2 id="t-aide">Sur téléphone et iPad</h2>
              <p>Pour l’avoir comme une appli : dans Safari, bouton <b>Partager</b> puis <b>Sur l’écran d’accueil</b>.</p>
              <p>La diction utilise le <b>micro</b> : autorise-le quand on te le demande. ${Reco ? '' : 'Ce navigateur ne sait pas écouter ta voix : tu pourras te noter toi-même.'}</p>
              <p>Ta progression reste sur cet appareil.</p>
            </section>
          </aside>
        </div>`;

      $('#go').addEventListener('click', () => demarrer(jourSel));
      $$('.st').forEach(b => b.addEventListener('click', () => demarrer(jourSel, b.dataset.bloc)));
      $$('.jour').forEach(b => b.addEventListener('click', () => { jourSel = Number(b.dataset.jour); renderAccueil(); }));
    }

    /* =========================================================
       Séance
       ========================================================= */

    function demarrer(n, depuis) {
      const ej = etatJour(n);
      let ids;
      if (depuis) ids = BLOCS.slice(BLOCS.findIndex(b => b.id === depuis)).map(b => b.id);
      else {
        ids = BLOCS.filter(b => !ej.blocs[b.id]).map(b => b.id);
        if (!ids.length) ids = BLOCS.map(b => b.id);
      }
      seance = { n, ids, bi: 0, etapes: [], ei: 0, ok: 0, total: 0, t0: null, enCours: new Set(ids) };
      app.innerHTML = `
        <div class="seance">
          <header class="barre">
            <button class="bouton discret" id="quitter">Quitter</button>
            <div class="mini-ligne" aria-hidden="true">
              ${BLOCS.map(b => `<span class="seg" style="--c: var(${b.c})" data-seg="${b.id}"><span class="rempli"></span></span>`).join('')}
            </div>
            <p class="chrono" aria-label="Temps passé sur ce jour"><span id="chrono">00:00</span><span class="sur"> / ${OBJECTIF_MIN}:00</span></p>
          </header>
          <main class="scene">
            <p class="etiquette" id="etiquette"></p>
            <article class="carte" id="carte"></article>
          </main>
        </div>`;
      $('#quitter').addEventListener('click', renderAccueil);
      window.scrollTo(0, 0);
      demarrerChrono();
      lancerBloc();
    }

    const blocCourant = () => BLOCS.find(b => b.id === seance.ids[seance.bi]);

    function lancerBloc() {
      const b = blocCourant();
      seance.etapes = etapesDuBloc(seance.n, b.id);
      seance.ei = 0; seance.ok = 0; seance.total = 0;
      const s = $('.seance');
      s.style.setProperty('--accent', `var(${b.c})`);
      s.style.setProperty('--sur', `var(${b.sur})`);
      renderEtape();
    }

    function majBarre() {
      const ej = etatJour(seance.n);
      const actuel = blocCourant();
      BLOCS.forEach(b => {
        let p = 0;
        if (b === actuel) p = seance.etapes.length ? seance.ei / seance.etapes.length : 0;
        else if (ej.blocs[b.id] && !(seance.enCours.has(b.id) && seance.ids.indexOf(b.id) > seance.bi)) p = 1;
        const r = $(`[data-seg="${b.id}"] .rempli`);
        if (r) r.style.width = `${Math.round(p * 100)}%`;
      });
    }

    function renderEtape() {
      const b = blocCourant();
      const num = BLOCS.indexOf(b) + 1;
      $('#etiquette').innerHTML = `Station ${num} · <b>${b.nom}</b> · ${seance.ei + 1}/${seance.etapes.length}`;
      majBarre();
      const e = seance.etapes[seance.ei];
      e.note = false;
      const carte = $('#carte');
      ({ carte: etapeCarte, lecon: etapeLecon, tableau: etapeTableau, qcm: etapeQcm, saisie: etapeSaisie, parole: etapeParole })[e.type](e, carte);
    }

    function noter(e, bien) {
      if (e.note) return;
      e.note = true;
      seance.total++;
      if (bien) seance.ok++;
    }

    function suivante() {
      if (Reco && recoActive) { try { recoActive.abort(); } catch (err) { /* rien */ } }
      seance.ei++;
      if (seance.ei >= seance.etapes.length) finBloc();
      else renderEtape();
      window.scrollTo(0, 0);
    }

    function boutonContinuer(libelle = 'Continuer') {
      return `<div class="actions"><button class="bouton principal" id="continuer">${libelle}</button></div>`;
    }
    function brancherContinuer(focus = true) {
      const c = $('#continuer');
      c.addEventListener('click', suivante);
      if (focus) c.focus({ preventScroll: true });
    }

    /* ---- Carte de vocabulaire ---- */
    function etapeCarte(e, carte) {
      const [en, fr, ex, exFr] = e.mot;
      carte.innerHTML = `
        <p class="consigne">Nouveau mot</p>
        <div class="mot-zone">
          <p class="mot" lang="en">${esc(en)}</p>

          <p class="exemple-fr">${esc(exFr)}</p>

          const boite = etat.mots[en] || 0;

          noter(e, savait);
          suivante();
        }));
        $('[data-savait="1"]').focus({ preventScroll: true });
      });
    }

    /* ---- Leçon ---- */
    function etapeLecon(e, carte) {
      carte.innerHTML = `
        <p class="consigne">${esc(e.consigne)}</p>
        <h2>${esc(e.titre)}</h2>
        <div class="texte">${e.html}</div>

          <li><button class="rond" data-dire="${esc(en)}" aria-label="Écouter : ${esc(en)}">${ICONE_SON}</button>
          <span><span class="ex-en" lang="en">${esc(en)}</span><span class="ex-fr">${esc(fr)}</span></span></li>`).join('')}</ul>` : ''}
        ${boutonContinuer('J’ai compris, on s’entraîne')}`;
      brancherContinuer(false);
    }

    /* ---- Tableau de verbes ---- */
    function etapeTableau(e, carte) {
      carte.innerHTML = `
        <p class="consigne">À apprendre par cœur</p>
        <h2>${esc(e.titre)}</h2>
        <div class="table-defile">
          <table class="verbes">
            <thead><tr><th scope="col">Base</th><th scope="col">Prétérit</th><th scope="col">Participe passé</th><th scope="col"><span class="sr">Écouter</span></th></tr></thead>
            <tbody>
              ${e.verbes.map(([base, pret, part, sens]) => `<tr>
                <td class="base" lang="en">${esc(base)}<span class="sens" lang="fr">${esc(sens)}</span></td>
                <td lang="en">${esc(pret)}</td><td lang="en">${esc(part)}</td>
                <td><button class="rond" data-dire="${esc(`${base}, ${pret}, ${part}`)}" aria-label="Écouter ${esc(base)}">${ICONE_SON}</button></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <p class="astuce">Récite chaque ligne à voix haute, trois fois, en tapant le rythme : « go, went, gone ». Ensuite, tu complètes des phrases.</p>
        ${boutonContinuer('C’est parti')}`;
      brancherContinuer(false);
    }

    /* ---- Question à choix ---- */
    const BRAVOS = ['Bien joué !', 'Exact !', 'Parfait !', 'Bravo !', 'Oui, c’est ça !'];
    function etapeQcm(e, carte) {
      const trou = e.texte.includes('___');
      carte.innerHTML = `
        <p class="consigne">${esc(e.consigne)}</p>
        <p class="enonce" id="enonce"${e.anglais ? ' lang="en"' : ''}>${trou ? avecTrou(e.texte) : esc(e.texte)}</p>
        <div class="options" role="group" aria-label="Réponses possibles">
          ${e.options.map((o, i) => `<button class="option" data-i="${i}">${esc(o)}</button>`).join('')}
        </div>
        <div class="retour-rep" id="retour" role="status" hidden></div>
        <div id="suite"></div>`;
      $$('.option', carte).forEach(btn => btn.addEventListener('click', () => {
        const choix = e.options[Number(btn.dataset.i)];
        const bien = choix === e.bonne;
        noter(e, bien);
        if (e.mot) { etat.mots[e.mot] = bien ? Math.max(2, etat.mots[e.mot] || 0) : 1; sauver(); }
        $$('.option', carte).forEach(o => {
          o.disabled = true;
          if (e.options[Number(o.dataset.i)] === e.bonne) o.classList.add('bon');
        });
        if (!bien) btn.classList.add('faux');
        if (trou) $('#enonce').innerHTML = avecTrou(e.texte, e.bonne);
        const r = $('#retour');
        r.hidden = false;
        r.innerHTML = `
          <p class="verdict ${bien ? 'bon' : 'faux'}">${bien ? BRAVOS[Math.floor(Math.random() * BRAVOS.length)] : `Pas tout à fait. Réponse : ${esc(e.bonne)}`}</p>
          ${e.ecoute ? `<p class="ecoute-ligne"><button class="rond" data-dire="${esc(e.ecoute)}" aria-label="Écouter la phrase">${ICONE_SON}</button><span lang="en">${esc(e.ecoute)}</span></p>` : ''}
          ${e.expl ? `<p class="expl">${esc(e.expl)}</p>` : ''}`;
        $('#suite').innerHTML = boutonContinuer();
        brancherContinuer();
      }));
    }

    /* ---- Réponse à taper ---- */
    const propre = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim();
    function etapeSaisie(e, carte) {
      carte.innerHTML = `
        <p class="consigne">Mets le verbe <b lang="en">${esc(e.verbe)}</b> à la bonne forme</p>
        <p class="enonce" id="enonce" lang="en">${avecTrou(e.texte)}</p>
        <form class="saisie" id="form-saisie" autocomplete="off" novalidate>
          <label for="champ" class="sr">Ta réponse</label>
          <input id="champ" name="champ" type="text" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Ta réponse">
          <button class="bouton principal" type="submit" id="verifier">Vérifier</button>
        </form>
        <button class="lien" id="sais-pas" type="button">Je ne sais pas, montre-moi</button>
        <div class="retour-rep" id="retour" role="status" hidden></div>
        <div id="suite"></div>`;
      const champ = $('#champ');
      champ.focus({ preventScroll: true });
      function corriger(abandon) {
        const val = propre(champ.value);
        if (!abandon && !val) { champ.focus(); return; }
        const bien = !abandon && e.reps.includes(val);
        noter(e, bien);
        champ.disabled = true; $('#verifier').disabled = true; $('#sais-pas').hidden = true;
        $('#enonce').innerHTML = avecTrou(e.texte, e.reps[0]);
        const phrase = e.texte.replace('___', e.reps[0]);
        const r = $('#retour');
        r.hidden = false;
        r.innerHTML = `
          <p class="verdict ${bien ? 'bon' : 'faux'}">${bien ? BRAVOS[Math.floor(Math.random() * BRAVOS.length)] : abandon ? `La réponse : ${esc(e.reps[0])}` : `Presque. La réponse : ${esc(e.reps[0])}`}</p>
          <p class="ecoute-ligne"><button class="rond" data-dire="${esc(phrase)}" aria-label="Écouter la phrase">${ICONE_SON}</button><span lang="en">${esc(phrase)}</span></p>`;
        $('#suite').innerHTML = boutonContinuer();
        brancherContinuer();
      }
      $('#form-saisie').addEventListener('submit', ev => { ev.preventDefault(); corriger(false); });
      $('#sais-pas').addEventListener('click', () => corriger(true));
    }

    /* ---- Diction ---- */
    let recoActive = null;
    function etapeParole(e, carte) {
      let meilleur = null;
      carte.innerHTML = `
        <p class="consigne">Écoute, puis répète la phrase</p>
        <p class="phrase-dite" id="phrase" lang="en">${e.en.split(' ').map(w => `<span class="m">${esc(w)}</span>`).join(' ')}</p>
        <p class="trad">${esc(e.fr)}</p>
        <div class="ecoutes">
          <button class="bouton" data-dire="${esc(e.en)}">${ICONE_SON} Écouter</button>
          <button class="bouton" data-dire="${esc(e.en)}" data-lent="1">Plus lentement</button>
        </div>
        <div class="micro-zone">
          ${Reco ? `<button class="bouton micro" id="micro">${ICONE_MICRO}<span>Je répète</span></button>` : ''}
          <p class="micro-info" id="micro-info">${Reco ? 'Appuie, dis la phrase, puis attends une seconde.' : 'Ce navigateur ne sait pas écouter ta voix. Répète la phrase à voix haute, puis note-toi.'}</p>
        </div>
        <div class="retour-rep" id="retour" role="status" hidden></div>
        <div class="actions" id="fin-parole">
          <p class="question-auto">Comment c’était ?</p>
          <button class="bouton" data-auto="0">À retravailler</button>
          <button class="bouton principal" data-auto="1">Bien prononcé</button>
        </div>`;

      function autoEval() {
        $$('[data-auto]').forEach(btn => btn.addEventListener('click', () => { noter(e, btn.dataset.auto === '1'); suivante(); }));
      }
      autoEval();

      function afficher(res) {
        if (!meilleur || res.score >= meilleur.score) meilleur = res;
        const spans = $$('#phrase .m');
        res.mots.forEach((m, i) => { if (spans[i]) spans[i].className = `m ${m.ok ? 'ok' : 'rate'}`; });
        const pct = Math.round(res.score * 100);
        const verdict = res.score >= 0.85 ? ['bon', 'Excellent !'] : res.score >= 0.6 ? ['bon', 'Pas mal ! Réécoute les mots en rouge.'] : ['faux', 'Réessaie : écoute d’abord la version lente.'];
        const r = $('#retour');
        r.hidden = false;
        r.innerHTML = `<p class="verdict ${verdict[0]}">${verdict[1]}</p><p class="expl">${pct} % des mots reconnus. J’ai entendu : « <span lang="en">${esc(res.texte)}</span> »</p>`;
        $('#fin-parole').innerHTML = `
          <button class="bouton" id="reessayer">Réessayer</button>
          <button class="bouton principal" id="continuer">Continuer</button>`;
        $('#reessayer').addEventListener('click', () => $('#micro').click());
        $('#continuer').addEventListener('click', () => { noter(e, meilleur.score >= 0.6); suivante(); });
      }

      const micro = $('#micro');
      if (!micro) return;
      micro.addEventListener('click', () => {
        const info = $('#micro-info');
        if (recoActive) { try { recoActive.stop(); } catch (err) { /* rien */ } return; }
        if (synth) synth.cancel();
        let r;
        try { r = new Reco(); } catch (err) { info.textContent = 'Le micro n’a pas pu démarrer. Note-toi avec les boutons ci-dessous.'; return; }
        r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 4; r.continuous = false;
        let recu = false, erreur = false;
        r.onresult = ev => {
          recu = true;
          const alts = Array.from(ev.results[0]).map(a => a.transcript);
          const res = alts.map(t => comparer(e.en, t)).sort((x, y) => y.score - x.score)[0];
          info.textContent = 'Appuie à nouveau pour réessayer.';
          afficher(res);
        };
        r.onerror = ev => {
          erreur = true;
          const msg = {
            'not-allowed': 'Le micro est bloqué ici. Autorise-le dans les réglages du navigateur, ou note-toi avec les boutons ci-dessous.',
            'service-not-allowed': 'Le micro est bloqué ici. Autorise-le dans les réglages du navigateur, ou note-toi avec les boutons ci-dessous.',
            'no-speech': 'Je n’ai rien entendu. Réessaie, un peu plus près du micro.',
            'audio-capture': 'Aucun micro trouvé sur cet appareil.',
            'network': 'La reconnaissance de la voix a besoin d’internet.',
            'aborted': '',
          }[ev.error];
          info.textContent = msg ?? 'La reconnaissance de la voix a échoué. Réessaie, ou note-toi.';
        };
        r.onend = () => {
          recoActive = null;
          if (!document.body.contains(micro)) return;
          micro.classList.remove('actif');
          micro.lastElementChild.textContent = 'Je répète';
          if (!recu && !erreur) info.textContent = 'Je n’ai rien entendu. Réessaie, un peu plus près du micro.';
        };
        try {
          r.start();
          recoActive = r;
          micro.classList.add('actif');
          micro.lastElementChild.textContent = 'J’écoute… (touche pour arrêter)';
          info.textContent = 'Parle maintenant.';
        } catch (err) {
          info.textContent = 'Le micro n’a pas pu démarrer. Note-toi avec les boutons ci-dessous.';
        }
      });
    }

    /* ---- Fin d'une station ---- */
    function finBloc() {
      const b = blocCourant();
      const ej = etatJour(seance.n);
      ej.blocs[b.id] = { ok: seance.ok, total: seance.total };
      seance.enCours.delete(b.id);
      compterTemps();
      sauver();
      seance.ei = seance.etapes.length;
      majBarre();
      const suivantId = seance.ids[seance.bi + 1];
      const suivant = BLOCS.find(x => x.id === suivantId);
      const pct = seance.total ? seance.ok / seance.total : 1;
      const mot = pct >= 0.85 ? 'Très solide.' : pct >= 0.6 ? 'C’est en bonne voie.' : 'On reverra ça : refais cette station demain.';
      $('#etiquette').innerHTML = `Station ${BLOCS.indexOf(b) + 1} · <b>${b.nom}</b> · terminée`;
      $('#carte').innerHTML = `
        <div class="bravo">
          <p class="consigne">Station terminée</p>
          <h2>${b.nom} : ${seance.ok}/${seance.total}</h2>
          <p>${mot}</p>
          <div class="actions">
            <button class="bouton" id="pause">Faire une pause</button>
            <button class="bouton principal" id="suite-bloc">${suivant ? `Station suivante : ${suivant.nom}` : 'Voir le bilan'}</button>
          </div>
        </div>`;
      $('#pause').addEventListener('click', renderAccueil);
      const s = $('#suite-bloc');
      s.focus({ preventScroll: true });
      s.addEventListener('click', () => {
        seance.bi++;
        if (suivant) { lancerBloc(); window.scrollTo(0, 0); } else finSeance();
      });
    }

    /* ---- Bilan de la séance ---- */
    function finSeance() {
      const n = seance.n;
      arreterChrono();
      const ej = etatJour(n);
      const complet = BLOCS.every(b => ej.blocs[b.id]);
      if (complet) {
        if (!ej.fini) ej.fini = dateCle(new Date());
        etat.seances++;
        majSerie();
      }
      sauver();
      const ok = BLOCS.reduce((s, b) => s + (ej.blocs[b.id] ? ej.blocs[b.id].ok : 0), 0);
      const total = BLOCS.reduce((s, b) => s + (ej.blocs[b.id] ? ej.blocs[b.id].total : 0), 0);
      const pct = total ? Math.round(ok / total * 100) : 0;
      const serie = serieActuelle();
      const J = JOURS[n - 1];
      const prochainJour = JOURS[n];
      const restants = BLOCS.filter(b => !ej.blocs[b.id]);
      seance = null;

      app.innerHTML = `
        <div class="seance" style="--accent: var(--l-conj); --sur: var(--sur-accent)">
          <header class="barre">
            <button class="bouton discret" id="accueil">Accueil</button>
            <div class="mini-ligne" aria-hidden="true">
              ${BLOCS.map(b => `<span class="seg" style="--c: var(${b.c})"><span class="rempli" style="width: ${ej.blocs[b.id] ? 100 : 0}%"></span></span>`).join('')}
            </div>
            <p class="chrono"><span>${mmss(ej.secondes)}</span><span class="sur"> / ${OBJECTIF_MIN}:00</span></p>
          </header>
          <main class="scene">
            <p class="etiquette">Jour ${J.n} · <b>${esc(J.theme)}</b></p>
            <article class="carte bravo">
              <p class="consigne">${complet ? 'Terminus' : 'Pause'}</p>
              <h2>${complet ? 'Séance terminée, bravo !' : 'Bien avancé !'}</h2>
              <dl class="chiffres bilan-chiffres">
                <div><dt>Temps</dt><dd>${Math.max(1, Math.round(ej.secondes / 60))} min</dd></div>
                <div><dt>Bonnes réponses</dt><dd>${pct} %</dd></div>
                <div><dt>Série</dt><dd>${pluriel(serie, 'jour')}</dd></div>
              </dl>
              <ul class="recap">
                ${BLOCS.map(b => {
                  const r = ej.blocs[b.id];
                  return `<li style="--c: var(${b.c})"><span class="point${r ? '' : ' vide'}"></span><span>${b.nom}</span><span>${r ? `${r.ok}/${r.total}` : 'à faire'}</span></li>`;
                }).join('')}
              </ul>
              <p>${complet
                ? (prochainJour ? `Demain : jour ${prochainJour.n}, ${esc(prochainJour.theme.toLowerCase())}.` : 'Tu as fini la première semaine du programme !')
                : `Il te reste : ${restants.map(b => b.nom.toLowerCase()).join(', ')}.`}</p>
              <div class="actions">
                <button class="bouton" id="accueil-2">Retour à l’accueil</button>
                ${complet && prochainJour ? `<button class="bouton principal" id="jour-suivant">Voir le jour ${prochainJour.n}</button>` : ''}
              </div>
            </article>
          </main>
        </div>`;
      window.scrollTo(0, 0);
      $('#accueil').addEventListener('click', renderAccueil);
      $('#accueil-2').addEventListener('click', renderAccueil);
      const js = $('#jour-suivant');
      if (js) js.addEventListener('click', () => { jourSel = prochainJour.n; renderAccueil(); });
      if (js) js.focus({ preventScroll: true });
    }

    /* =========================================================
       Chronomètre (compte le temps passé, se met en pause si l'écran est caché)
       ========================================================= */

    function compterTemps() {
      if (!seance || !seance.t0) return;
      const maintenant = Date.now();
      const d = (maintenant - seance.t0) / 1000;
      etatJour(seance.n).secondes += d;
      etat.secondes += d;
      seance.t0 = maintenant;
    }
    function majChrono() {
      const el = $('#chrono');
      if (!el || !seance) return;
      const s = etatJour(seance.n).secondes + (seance.t0 ? (Date.now() - seance.t0) / 1000 : 0);
      el.textContent = mmss(s);
    }
    function demarrerChrono() {
      clearInterval(chronoId);
      seance.t0 = Date.now();
      chronoId = setInterval(majChrono, 1000);
      majChrono();
    }
    function arreterChrono() {
      if (chronoId) { clearInterval(chronoId); chronoId = null; }
      if (seance) { compterTemps(); seance.t0 = null; sauver(); }
    }
    document.addEventListener('visibilitychange', () => {
      if (!seance || !chronoId) return;
      if (document.hidden) { compterTemps(); seance.t0 = null; sauver(); }
      else seance.t0 = Date.now();
    });

    // Tous les boutons « Écouter » de l'appli.
    app.addEventListener('click', ev => {
      const b = ev.target.closest('[data-dire]');
      if (b) dire(b.dataset.dire, b.dataset.lent === '1');
    });

    function demarrage(data) {
      if (data && data.jourSel && JOURS[data.jourSel - 1]) jourSel = data.jourSel;
      renderAccueil();
    }
    window.claude?.hot?.snapshot(() => ({ jourSel }));
    window.claude?.hot?.ready ? window.claude.hot.ready(demarrage) : demarrage(window.claude?.hot?.data ?? {});
  })();
  </script>
</body>
</html>
